<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión Documental - UNEMI{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --unemi-azul-oscuro: #1e3a5f;
        --unemi-azul-claro: #2c4a6b;
        --unemi-naranja: #ff6b35;
        --unemi-naranja-claro: #ff8c5a;
        --unemi-gris-oscuro: #1e293b;
        --unemi-gris-claro: #f8fafc;
    }

    /* Clases de utilidad personalizadas para Tailwind si no compilas el CSS */
    .bg-unemi-blue { background-color: var(--unemi-azul-oscuro); }
    .bg-unemi-blue-light { background-color: var(--unemi-azul-claro); }
    .bg-unemi-orange { background-color: var(--unemi-naranja); }
    .text-unemi-blue { color: var(--unemi-azul-oscuro); }
    .text-unemi-orange { color: var(--unemi-naranja); }
    .border-unemi-orange { border-color: var(--unemi-naranja); }
    
    .btn-primary {
        background-color: var(--unemi-naranja);
        color: white;
    }
    .btn-primary:hover {
        background-color: var(--unemi-naranja-claro);
    }
    
    .btn-secondary {
        background-color: var(--unemi-azul-oscuro);
        color: white;
    }
    .btn-secondary:hover {
        background-color: var(--unemi-azul-claro);
    }
    
    /* Estilo para Tabs Activos */
    .tab-active {
        border-bottom: 2px solid var(--unemi-naranja);
        color: var(--unemi-azul-oscuro);
        font-weight: 600;
    }
    .tab-inactive {
        border-bottom: 2px solid transparent;
        color: #64748b; /* slate-500 */
    }
    .tab-inactive:hover {
        color: var(--unemi-azul-claro);
        border-bottom: 2px solid #cbd5e1;
    }
</style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <span class="text-2xl font-bold text-slate-800">SGA<span class="text-orange-500">+</span></span>
                    </div>
                </div>

            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                    <div class="p-4 rounded-lg {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-slate-200 mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-slate-400">© 2025 UNEMI - Gestión Documental IA</p>
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
