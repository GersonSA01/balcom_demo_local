<div id="uploadModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden overflow-y-auto h-full w-full z-50 flex items-center justify-center">
    <div class="relative mx-auto p-5 border w-11/12 md:w-2/3 lg:w-1/2 shadow-lg rounded-md bg-white">
        <div class="mt-3">
            <div class="flex justify-between items-center pb-3 border-b mb-4">
                <h3 class="text-xl font-semibold text-gray-900">Subir Nuevo Documento (RAG)</h3>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            
            <form id="uploadForm" action="{% url 'chatbot:upload_document' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Archivos PDF</label>
                    <div class="flex items-center justify-center w-full">
                        <label class="flex flex-col w-full h-32 border-2 border-dashed hover:bg-gray-50 border-gray-300 cursor-pointer rounded-lg transition-colors">
                            <div class="flex flex-col items-center justify-center pt-7">
                                <svg class="w-8 h-8 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                <p class="pt-1 text-sm tracking-wider text-gray-500">Seleccione uno o más archivos</p>
                            </div>
                            <input type="file" name="file" class="opacity-0" multiple required accept=".pdf"/>
                        </label>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">¿Quién puede ver esto?</label>
                    <div class="bg-gray-50 p-3 rounded-lg border max-h-48 overflow-y-auto">
                        <div class="grid grid-cols-1 gap-2">
                        {% for rol in chatbot_roles %}
                        <label class="flex items-start p-2 border rounded bg-white hover:bg-blue-50 cursor-pointer transition-colors relative group">
                            <input type="checkbox" name="roles" value="{{ rol.id }}" class="mt-1.5 mr-3 rounded text-blue-600 focus:ring-blue-500">
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-center mb-0.5">
                                    <span class="text-sm font-semibold text-gray-700 truncate">{{ rol.nombre }}</span>
                                    {% if rol.carreras.exists %}
                                        <span class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded border border-blue-200 font-medium">Específico</span>
                                    {% else %}
                                        <span class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded border border-green-200 font-medium">Global</span>
                                    {% endif %}
                                </div>
                                <div class="text-xs text-gray-500 truncate">
                                    <span class="font-mono text-[10px] text-gray-400 uppercase border px-1 rounded mr-1">{{ rol.campo_sga }}</span>
                                </div>
                            </div>
                        </label>
                        {% endfor %}
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div class="flex items-center bg-blue-50 p-2 rounded border border-blue-100">
                        <input type="checkbox" name="is_infinite" id="new_infinite" checked onchange="toggleDateInputs('new')" class="w-4 h-4 text-blue-600 rounded">
                        <label for="new_infinite" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">Vigencia Infinita</label>
                    </div>
                    <div id="new_dates" class="col-span-2 grid grid-cols-2 gap-4 hidden">
                         <div>
                            <label class="block text-xs text-gray-500 mb-1">Válido Desde</label>
                            <input type="date" name="valid_from" id="new_valid_from" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 text-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Válido Hasta</label>
                            <input type="date" name="valid_to" id="new_valid_to" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 text-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end pt-4 border-t">
                    <button type="button" onclick="closeUploadModal()" class="px-4 py-2 mr-2 text-gray-600 bg-white border rounded hover:bg-gray-50">Cancelar</button>
                    <button type="submit" class="px-6 py-2 bg-blue-600 text-white font-medium rounded shadow-sm hover:bg-blue-700 focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Subir e Indexar
                    </button>
                </div>
            </form>
            
            <div id="uploadLoading" class="hidden flex-col items-center justify-center py-10">
                <svg class="animate-spin h-10 w-10 text-blue-600 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-gray-600 font-medium">Procesando documento e indexando en IA...</p>
                <p class="text-gray-400 text-xs">Esto puede tomar unos segundos.</p>
            </div>
        </div>
    </div>
</div>

<div id="editModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden overflow-y-auto h-full w-full z-50 flex items-center justify-center">
    <div class="relative mx-auto p-5 border w-11/12 md:w-2/3 lg:w-1/2 shadow-lg rounded-md bg-white">
        <div class="mt-3">
            <div class="flex justify-between items-center pb-3 border-b mb-4">
                <h3 class="text-xl font-semibold text-gray-900">Editar Documento</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>

                    Estás editando los permisos y vigencia del archivo.

                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-center mb-0.5">
                                    <span class="text-sm font-semibold text-gray-700 truncate">{{ rol.nombre }}</span>
                                    {% if rol.carreras.exists %}
                                        <span class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded border border-blue-200 font-medium">Específico</span>
                                    {% else %}
                                        <span class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded border border-green-200 font-medium">Global</span>
                                    {% endif %}
                                </div>
                                <div class="text-xs text-gray-500 truncate">
                                    <span class="font-mono text-[10px] text-gray-400 uppercase border px-1 rounded mr-1">{{ rol.campo_sga }}</span>
                                </div>
                            </div>
                        </label>
                        {% endfor %}
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div class="flex items-center bg-green-50 p-2 rounded border border-green-100">
                        <input type="checkbox" name="is_infinite" id="ed_infinite" onchange="toggleDateInputs('ed')" class="w-4 h-4 text-green-600 rounded">
                        <label for="ed_infinite" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">Vigencia Infinita</label>
                    </div>
                    
                    <div id="ed_dates" class="col-span-2 grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Válido Desde</label>
                            <input type="date" name="valid_from" id="ed_valid_from" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 text-sm focus:ring-green-500 focus:border-green-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Válido Hasta</label>
                            <input type="date" name="valid_to" id="ed_valid_to" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 text-sm focus:ring-green-500 focus:border-green-500">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end pt-4 border-t">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 mr-2 text-gray-600 bg-white border rounded hover:bg-gray-50">Cancelar</button>
                    <button type="submit" class="px-6 py-2 bg-green-600 text-white font-medium rounded shadow-sm hover:bg-green-700 focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
