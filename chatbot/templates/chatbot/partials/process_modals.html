<div id="createProcessModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl p-6 m-4 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-bold text-slate-800">Registrar Nuevo Proceso</h3>
            <button onclick="toggleModal('createProcessModal', false)" class="text-slate-400 hover:text-slate-600">✕</button>
        </div>

        <form action="{% url 'chatbot:create_process' %}" method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
                    <input type="text" name="name" required class="w-full rounded-lg border-slate-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Trigger (Función)</label>
                    <select name="trigger_function" required class="w-full rounded-lg border-slate-300">
                        <option value="change_career">Cambio de carrera</option>
                        <option value="drop_subject">Retiro de asignatura</option> <option value="contact_agent">Contactar Asesor</option>
                    </select>
                </div>
            </div>
            
            <div class="flex items-center gap-2 py-2">
                <input type="checkbox" id="proc_inf_create" name="is_infinite" class="rounded text-orange-600" onchange="toggleDateFields('create')">
                <label for="proc_inf_create" class="text-sm font-medium text-slate-700">Proceso indefinido</label>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="dates_create">
                <div><label class="text-xs text-slate-500">Inicio</label><input type="date" name="start_date" class="w-full rounded-lg border-slate-300"></div>
                <div><label class="text-xs text-slate-500">Fin</label><input type="date" name="end_date" class="w-full rounded-lg border-slate-300"></div>
            </div>

            <textarea name="active_message" rows="2" placeholder="Mensaje de Instrucción" class="w-full rounded-lg border-slate-300" required></textarea>
            <textarea name="closed_message" rows="2" placeholder="Mensaje de Rechazo" class="w-full rounded-lg border-slate-300" required></textarea>

            <div class="flex justify-end gap-3 pt-4 border-t">
                <button type="button" onclick="toggleModal('createProcessModal', false)" class="btn-secondary">Cancelar</button>
                <button type="submit" class="bg-orange-600 text-white px-4 py-2 rounded-lg">Guardar</button>
            </div>
        </form>
    </div>
</div>

<div id="editProcessModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl p-6 m-4 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-bold text-slate-800">Editar Proceso</h3>
            <button onclick="toggleModal('editProcessModal', false)" class="text-slate-400 hover:text-slate-600">✕</button>
        </div>

        <form id="editProcessForm" action="" method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
                    <input type="text" id="ep_name" name="name" required class="w-full rounded-lg border-slate-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Trigger</label>
                    <select id="ep_trigger" name="trigger_function" required class="w-full rounded-lg border-slate-300">
                        <option value="change_career">Cambio de carrera</option>
                        <option value="drop_subject">Retiro de asignatura</option>
                        <option value="contact_agent">Contactar Asesor</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center gap-2 py-2">
                <input type="checkbox" id="ep_infinite" name="is_infinite" class="rounded text-orange-600" onchange="toggleDateFields('edit')">
                <label for="ep_infinite" class="text-sm font-medium text-slate-700">Proceso indefinido</label>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="dates_edit">
                <div><label class="text-xs text-slate-500">Inicio</label><input type="date" id="ep_start" name="start_date" class="w-full rounded-lg border-slate-300"></div>
                <div><label class="text-xs text-slate-500">Fin</label><input type="date" id="ep_end" name="end_date" class="w-full rounded-lg border-slate-300"></div>
            </div>

            <div>
                <label class="text-xs font-bold text-green-600">Instrucción (Activo)</label>
                <textarea id="ep_active_msg" name="active_message" rows="2" class="w-full rounded-lg border-slate-300" required></textarea>
            </div>
            <div>
                <label class="text-xs font-bold text-red-500">Rechazo (Cerrado)</label>
                <textarea id="ep_closed_msg" name="closed_message" rows="2" class="w-full rounded-lg border-slate-300" required></textarea>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t">
                <button type="button" onclick="toggleModal('editProcessModal', false)" class="px-4 py-2 border rounded-lg">Cancelar</button>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Actualizar</button>
            </div>
        </form>
    </div>
</div>

<script>
    function toggleModal(modalId, show) {
        const el = document.getElementById(modalId);
        if(show) { el.classList.remove('hidden'); el.classList.add('flex'); }
        else { el.classList.add('hidden'); el.classList.remove('flex'); }
    }

    function toggleDateFields(mode) {
        const isInf = document.getElementById(mode === 'create' ? 'proc_inf_create' : 'ep_infinite').checked;
        const div = document.getElementById(mode === 'create' ? 'dates_create' : 'dates_edit');
        
        if (isInf) {
            div.style.opacity = '0.5';
            div.style.pointerEvents = 'none';
            div.querySelectorAll('input').forEach(i => i.required = false);
        } else {
            div.style.opacity = '1';
            div.style.pointerEvents = 'auto';
            div.querySelectorAll('input').forEach(i => i.required = true);
        }
    }

    function openEditProcessModal(id, name, trigger, isInf, start, end, activeMsg, closedMsg) {
        // 1. Configurar Action del Formulario
        const form = document.getElementById('editProcessForm');
        form.action = `/api/chatbot/procesos/editar/${id}/`; // Asegúrate que coincida con tu urls.py

        // 2. Llenar campos
        document.getElementById('ep_name').value = name;
        document.getElementById('ep_trigger').value = trigger;
        
        const infCheck = document.getElementById('ep_infinite');
        infCheck.checked = (isInf === 'True' || isInf === 'true' || isInf === true);
        
        document.getElementById('ep_start').value = start;
        document.getElementById('ep_end').value = end;
        document.getElementById('ep_active_msg').value = activeMsg;
        document.getElementById('ep_closed_msg').value = closedMsg;

        // 3. Ajustar UI fechas
        toggleDateFields('edit');

        // 4. Mostrar
        toggleModal('editProcessModal', true);
    }
</script>
